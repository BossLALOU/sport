<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1117">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Abdos 15'">
<title>Abdos 15'</title>
<style>
/* Layout : app mobile d'abord, colonne unique 720px, en-tête collant + 4 onglets ; minuteur plein écran par-dessus. */
:root{color-scheme:dark;
--bg:#0f1117;--card:#181b24;--card2:#21252f;--txt:#f2f4f8;--mut:#9aa3b5;--line:#2c3142;
--work:#ff6b35;--rest:#1fc9a4;--prep:#5b8cff;--cardio:#ff7a3d;--abdos:#b07cff;--gainage:#2ec4d6;--ok:#2ecc71;--bad:#ff6b6b}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,label:focus-within{outline:2px solid var(--prep);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(15,17,23,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.htop{max-width:720px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px}
h1{font-size:19px;margin:0;letter-spacing:.3px}
h1 span{background:linear-gradient(90deg,var(--work),#ff3d6e);-webkit-background-clip:text;background-clip:text;color:transparent}
#who{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);min-width:0}
#who img{width:24px;height:24px;border-radius:50%}
#who b{color:var(--txt);max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav{display:flex;max-width:720px;margin:6px auto 0}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:6px 2px 9px;font-size:13px;font-weight:700;border-bottom:3px solid transparent;display:flex;flex-direction:column;align-items:center;gap:1px}
nav button i{font-style:normal;font-size:17px}
nav button.on{color:var(--txt);border-color:var(--work)}
main{max-width:720px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view{display:none}.view.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;min-width:0}
h2{margin:4px 0 6px;font-size:20px;text-wrap:balance}h3{margin:0;font-size:17px}
.mut{color:var(--mut);font-size:14px;line-height:1.45;margin:6px 0}
.tag{display:inline-block;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;padding:3px 9px;border-radius:99px;background:#2a1a12;color:var(--work)}
.pill{font-size:13px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--card2);color:var(--mut);white-space:nowrap}
.rowb{display:flex;justify-content:space-between;align-items:center;gap:10px}
.rowb>*{min-width:0}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;scrollbar-width:none}
.day{flex:0 0 auto;width:104px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;position:relative}
.day b{display:block;font-size:16px}.day small{display:block;color:var(--mut);font-size:12px;line-height:1.25;margin-top:2px}
.day.on{border-color:var(--work);background:#2a1a12}
.day i{position:absolute;top:7px;right:9px;color:var(--ok);font-style:normal;font-weight:900}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin:8px 0 2px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;background:var(--c);vertical-align:-1px}
.blk{display:grid;grid-template-columns:20px 66px 1fr auto;gap:10px;align-items:center;padding:8px 10px 8px 8px;border-radius:12px;background:var(--card2);border-left:4px solid var(--c);margin-top:8px;cursor:pointer}
.blk .num{color:var(--mut);font-weight:800;font-size:13px;text-align:center}
.blk .bi{min-width:0}.blk .bi b{display:block;font-size:15px}.blk .bi span{font-size:13px;color:var(--c);font-weight:600}
.tw{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.pw,.pr{font-size:12px;font-weight:800;padding:2px 7px;border-radius:6px}
.pw{background:rgba(255,107,53,.18);color:var(--work)}.pr{background:rgba(31,201,164,.16);color:var(--rest)}
.thumb svg{width:66px;height:43px;display:block}
.big{width:100%;padding:18px;font-size:19px;font-weight:900;border:0;border-radius:16px;color:#fff;background:linear-gradient(135deg,#ff6b35,#ff3d6e);box-shadow:0 8px 24px rgba(255,80,60,.25)}
.btn{border:1px solid var(--line);background:var(--card2);color:var(--txt);padding:11px 14px;border-radius:12px;font-weight:700;font-size:14px;display:inline-block}
.btn.pri{background:var(--work);border-color:var(--work);color:#fff}
.btn.on{border-color:var(--work);color:var(--work)}
.btn.danger{color:var(--bad)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
textarea,input[type=number],input[type=text]{width:100%;background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:14px}
textarea{min-height:90px;resize:vertical}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font-size:24px;font-variant-numeric:tabular-nums}.stat span{font-size:12px;color:var(--mut)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th{text-align:left;color:var(--mut);font-size:12px;font-weight:700;padding:6px 4px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
.bar{height:8px;border-radius:9px;background:var(--card2);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;border-radius:9px}
.sess{border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:8px;background:var(--card2)}
.sess summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:8px;align-items:center}
.sess summary::-webkit-details-marker{display:none}
.chip{display:inline-block;font-size:12px;font-weight:800;padding:2px 8px;border-radius:6px;color:#111}
/* équipe */
.seg{display:inline-flex;background:var(--card2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 10px;border-radius:8px;font-size:13px;font-weight:700;color:var(--mut)}
.seg button.on{background:var(--bg);color:var(--txt)}
.ctrls{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chart svg{width:100%;height:auto;display:block}
.chart .ax{fill:var(--mut);font-size:14px;font-family:inherit}
.chart .gl{stroke:var(--line);stroke-width:1}
.lg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;margin-top:8px}
.lg span{display:inline-flex;align-items:center;gap:6px}
.lg span::before{content:"";width:14px;height:4px;border-radius:2px;background:var(--c)}
.ath{display:flex;align-items:center;gap:10px;cursor:pointer}
.ath .dot{width:12px;height:12px;border-radius:50%;background:var(--c);flex:0 0 auto}
.ath b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
.me-tag{font-size:11px;color:var(--work);font-weight:800;margin-left:4px}
.rank{color:var(--mut);font-weight:800;width:22px}
.banner{border:1px dashed var(--work);background:#1f1510}
/* minuteur */
.runner{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(16px,env(safe-area-inset-left,0px));transition:background .35s;overflow:hidden}
.ph-prep{background:radial-gradient(circle at 50% 28%,#23336a,#0d0f16 75%)}
.ph-work{background:radial-gradient(circle at 50% 28%,#6b2a12,#150b08 75%)}
.ph-rest{background:radial-gradient(circle at 50% 28%,#0e5546,#07130f 75%)}
.r-top{display:flex;justify-content:space-between;align-items:center}
#rPhase{font-weight:900;font-size:15px;letter-spacing:1.5px;padding:6px 14px;border-radius:99px;color:#fff}
.ph-prep #rPhase{background:var(--prep)}.ph-work #rPhase{background:var(--work)}.ph-rest #rPhase{background:var(--rest);color:#062}
#rCount{color:#ffffffb0;font-weight:700}
.r-bar{display:flex;gap:2px;height:8px;margin:12px 0 4px}
.r-bar div{height:100%;border-radius:3px;background:#ffffff22;position:relative;overflow:hidden}
.r-bar div i{position:absolute;inset:0;width:0;background:#fff}
.r-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:0}
.r-label{color:#ffffffa0;font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:1px;min-height:18px}
#rName{font-size:clamp(24px,7vw,38px);margin:4px 0 2px}
.r-target{font-size:clamp(18px,5.4vw,26px);font-weight:800;color:#ffd27a}
.r-fig{margin:6px 0;width:min(84vw,380px);max-width:100%}
.r-fig svg{width:100%;height:auto;display:block}
.r-time{font-size:clamp(76px,25vw,150px);font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.r-score{min-height:10px;margin-top:8px;width:100%;max-width:460px}
.r-score p{margin:0 0 6px;font-size:13px;color:#ffffffc0}
.r-foot{display:flex;justify-content:space-between;align-items:center;color:#ffffffc0}
.r-foot b{color:#fff;font-variant-numeric:tabular-nums}
.r-ctrl{display:flex;gap:8px}
.r-ctrl button{width:46px;height:46px;border-radius:50%;border:0;background:#ffffff1f;color:#fff;font-size:19px}
.r-ctrl button.off{opacity:.4}
.paused .r-time{opacity:.4}
.pz{display:none;position:absolute;left:0;right:0;top:40%;text-align:center;font-size:28px;font-weight:900}
.paused .pz{display:block}
.sp{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
.sp button{border:2px solid transparent;border-radius:10px;padding:7px 9px;font-size:13px;font-weight:800;color:#111;background:var(--c);opacity:.55;min-width:44px}
.sp button.sel{opacity:1;border-color:#fff;transform:scale(1.06)}
/* feuilles */
.ov{position:fixed;inset:0;z-index:60;background:rgba(5,6,10,.82);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 20px) max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--line)}
.sheet .fig-big svg{width:100%;max-width:420px;display:block;margin:0 auto;background:var(--bg);border-radius:14px}
.eb{background:var(--card2);border-radius:12px;padding:10px;margin-top:8px;border-left:4px solid var(--c)}
.eb .rowb b{font-size:14px}
.eb .sp{justify-content:flex-start;margin-top:8px}
.eb input{margin-top:8px;padding:7px 10px}
.feel{display:flex;gap:6px;margin-top:6px}
.feel button{flex:1;font-size:24px;padding:8px 0;border-radius:12px;border:2px solid var(--line);background:var(--card2)}
.feel button.sel{border-color:var(--work);background:#2a1a12}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%);background:#fff;color:#111;font-weight:700;padding:11px 16px;border-radius:12px;z-index:99;box-shadow:0 8px 30px #0008;max-width:90vw;text-align:center}
.empty{text-align:center;color:var(--mut);padding:24px 10px}
.small{font-size:12px;color:var(--mut)}
.code{font-family:ui-monospace,Menlo,monospace;font-size:12px}
@media (prefers-reduced-motion:reduce){.runner{transition:none}}
#app[hidden],#auth[hidden]{display:none!important}
#auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.authbox{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:14px}
.authbox h1{font-size:28px}
.authbox form{display:flex;flex-direction:column;gap:12px}
label:not(.btn):not(.tog):not(.chk):not(.inline){display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--mut);margin-top:8px}
.authbox .seg{display:flex}.authbox .seg button{flex:1;padding:9px}
input[type=password],select{width:100%;background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:16px}
input[type=text],input[type=number],input[type=password],textarea,select{font-size:16px}
.err{color:var(--bad);font-size:14px;min-height:18px;margin:0}
.role{font-size:10px;font-weight:900;padding:2px 6px;border-radius:6px;background:#1d1730;color:var(--abdos);text-transform:uppercase;letter-spacing:.5px}
.iconbtn{border:1px solid var(--line);background:var(--card2);border-radius:9px;min-width:32px;height:32px;font-size:16px;line-height:1;padding:0 6px;color:var(--txt)}
.iconbtn:disabled{opacity:.35}
.btn:disabled,.big:disabled{opacity:.6;cursor:wait}
.whobtn{display:flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:5px 9px;font-size:13px;max-width:180px}
.whobtn b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav{overflow-x:auto;scrollbar-width:none}
nav button{font-size:11.5px;min-width:56px}
nav button[hidden]{display:none!important}
/* semaine en cours */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:12px}
.wd{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.wd small{font-size:11px;color:var(--mut);font-weight:700}.wd b{font-size:16px;font-variant-numeric:tabular-nums}
.wd span{font-size:12px;min-height:16px;display:flex;gap:1px}.wd i{font-style:normal;opacity:.45}.wd i.ok{opacity:1}.wd i.rest{opacity:.4}
.wd.today{border-color:#ff6b3580}.wd.on{border-color:var(--work);background:#2a1a12}
.dayh{margin:4px 2px 10px;font-size:15px;color:var(--mut);text-transform:capitalize}
.tog{flex-direction:row;align-items:center;gap:10px;font-size:15px;color:var(--txt);font-weight:600;padding:8px 0}
.tog input,.chk input{width:20px;height:20px;accent-color:var(--work)}
.chk{flex-direction:row;align-items:center;gap:6px;margin:0;color:var(--txt);font-weight:600;font-size:13px;min-width:74px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.grid2>*{min-width:0}
.wlist{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.wrow{display:grid;grid-template-columns:32px 1fr;gap:8px;align-items:center;text-align:left;background:var(--card2);border:1px solid transparent;border-radius:10px;padding:8px 10px;font-size:14px}
.wrow.today{border-color:#ff6b3580}
.plan{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.prow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:var(--card2);border-radius:10px;padding:8px 10px}
.prow>b{width:26px}
.popts{display:flex;gap:6px;flex:1 1 100%;padding-left:38px}.popts select{margin:0;padding:6px 8px;font-size:14px}
.popts[hidden]{display:none}
.tplan td,.tplan th{text-align:center;padding:6px 2px}.tplan td:first-child,.tplan th:first-child{text-align:left}
.okline{color:var(--ok);font-weight:700;font-size:14px;margin:6px 0}
/* repas */
.daynav{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 10px;margin-bottom:12px;text-transform:capitalize}
.mb{margin-top:10px}.mb .rowb{font-size:14px}.mb .bar{margin-top:4px;height:10px}
.ritem{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.ritem>div{min-width:0}
.flist{display:flex;flex-direction:column;gap:6px;margin-top:10px;max-height:52vh;overflow:auto}
.fitem{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:2px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.feed{background:var(--card2);border-radius:10px;padding:8px 10px;margin-top:8px}
.vbars{display:flex;align-items:flex-end;gap:6px;height:110px;margin-top:6px}
.vbars div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
.vbars i{display:block;width:100%;background:linear-gradient(180deg,var(--work),#ff3d6e);border-radius:6px 6px 2px 2px;min-height:2px}
.vbars small{font-size:10px;color:var(--mut)}
/* séance salle */
.gymwrap{position:fixed;inset:0;z-index:55;background:var(--bg);overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 120px) max(16px,env(safe-area-inset-left,0px))}
.gymwrap[hidden]{display:none}
.gtop{display:flex;justify-content:space-between;align-items:center;max-width:720px;margin:0 auto}
.gdots{display:flex;gap:6px;max-width:720px;margin:12px auto}
.gdots button{flex:1;height:8px;border:0;border-radius:4px;background:#ffffff22;padding:0}
.gdots button.done{background:var(--ok)}.gdots button.on{outline:2px solid var(--work);outline-offset:2px}
.gcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;max-width:720px;margin:0 auto}
.gfig svg{width:100%;max-width:340px;display:block;margin:0 auto;background:var(--bg);border-radius:12px}
.gcard h2{margin:10px 0 2px}
.gsets{margin-top:10px}.gsets td{padding:6px 4px}.gsets input{padding:8px;text-align:center;font-size:17px}
.gsets tr.fait td{background:rgba(46,204,113,.08)}
.gok{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--card2);font-size:20px;font-weight:900}
.gsets tr.fait .gok{background:var(--ok);border-color:var(--ok);color:#06210f}
.gymwrap>.btns,.gymwrap>.big{max-width:720px;margin-left:auto;margin-right:auto}
.grest{position:fixed;left:0;right:0;bottom:0;z-index:56;display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(90deg,#0e5546 calc(var(--p,0)*100%),#0b2a24 calc(var(--p,0)*100%));border-top:1px solid #1fc9a455}
.grest[hidden]{display:none}
.gtime{font-size:40px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}

.grid2 .mb .rowb{font-size:12.5px;flex-wrap:wrap;gap:2px 8px}
.tog,.chk{display:flex}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{border:1px solid var(--line);background:var(--card2);border-radius:99px;padding:7px 12px;font-size:13px;font-weight:700;color:var(--mut)}
.chips button.on{border-color:var(--work);background:#2a1a12;color:var(--txt)}
label.inline{flex-direction:row;align-items:center;gap:10px}
label.inline input{width:auto}
.ritem.bad b{color:var(--bad)}
.mtot{margin-top:12px;font-size:14px;padding:10px;border-radius:10px;background:var(--card2)}
.mtot:empty{display:none}
.qprog{height:6px;border-radius:4px;background:var(--card2);overflow:hidden;margin:8px 0 4px}
.qprog i{display:block;height:100%;background:linear-gradient(90deg,var(--work),#ff3d6e)}
.qfield{margin-top:4px}
.qlab{font-size:13px;font-weight:700;color:var(--mut);margin-top:12px}
.seg.yn{display:flex;margin-top:8px}.seg.yn button{flex:1;padding:9px}

const fslug = s => String(s||'').replace(/œ/gi,'oe').replace(/æ/gi,'ae').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
const FOODS = FOODS_RAW.map(([n,a,k,pr,g,l,u,p])=>({n,al:a.split('|').map(fslug).sort((x,y)=>y.length-x.length),k,pr,g,l,u,p}));
const FOOD_ALIASES = FOODS.flatMap(f=>f.al.map(a=>({a,f}))).sort((x,y)=>y.a.length-x.a.length);
const NUM_WORDS = {un:1,une:1,deux:2,trois:3,quatre:4,cinq:5,six:6,demi:0.5,'1/2':0.5,moitie:0.5,quart:0.25};
// unités « ménagères » → grammes
const UNITS = [
  [/^(cuilleres?|c)\s*(a|à)?\s*(soupe|s)\b|^c\.?\s*a\.?\s*s\.?|^cas\b/i, f=>/huile/.test(f.n.toLowerCase())?10:15],
  [/^(cuilleres?|c)\s*(a|à)?\s*(cafe|café|c)\b|^c\.?\s*a\.?\s*c\.?|^cac\b/i, ()=>5],
  [/^tranches?\b/i, f=>f.u||30], [/^verres?\b/i, ()=>200], [/^bols?\b/i, ()=>250], [/^(boites?|boîtes?)\b/i, f=>f.u||140],
  [/^pots?\b/i, f=>f.u||125], [/^parts?\b/i, f=>f.u||120], [/^poignees?\b|^poignées?\b/i, ()=>30], [/^(doses?|scoops?|mesures?)\b/i, ()=>30],
  [/^canettes?\b/i, ()=>330], [/^carres?\b|^carrés?\b/i, ()=>5], [/^(portions?|assiettes?)\b/i, f=>f.p||150], [/^(morceaux?)\b/i, f=>f.u||30]
];
function matchFood(name){ const s=fslug(name); if(!s) return null; const hit=FOOD_ALIASES.find(x=>s.includes(x.a)); return hit?hit.f:null; }
function matchPlat(name){ const s=fslug(name); if(s.length<3) return null; return plats.find(p=>fslug(p.nom)===s) || plats.filter(p=>fslug(p.nom).length>=4 && s.includes(fslug(p.nom))).sort((a,b)=>b.nom.length-a.nom.length)[0] || null; }
// « riz 200g, steak haché 5% 150 g, 2 oeufs, 1 c.à.s huile » → lignes
function parseMealText(txt){
  const parts=String(txt||'').replace(/(\d),(\d)/g,'$1.$2').split(/[\n,;+]|\bet\b|\bavec\b/i).map(x=>x.trim()).filter(Boolean);
  return parts.map(raw=>{
    let s=' '+raw.toLowerCase().replace(/(\d),(\d)/g,'$1.$2').replace(/à/g,'a')+' ';
    let grams=null, count=null, unitFn=null, liquid=false;
    const w=s.match(/(\d+(?:\.\d+)?)\s*(kg|kilos?|g|gr|grammes?|ml|cl|l|litres?)(?![a-z])/i);
    if(w){ let v=+w[1]; const u=w[2].toLowerCase(); if(u==='kg'||u.startsWith('kilo')) v*=1000; else if(u==='cl') v*=10; else if(u==='l'||u.startsWith('litre')) v*=1000; grams=v; liquid=/ml|cl|^l/.test(u); s=s.replace(w[0],' '); }
    if(grams==null){
      const c=s.match(/^\s*(\d+(?:\.\d+)?|1\/2|une?|deux|trois|quatre|cinq|six|demi|moitie|quart)\b\s*(?:de\s+|d')?/i);
      if(c){ count=NUM_WORDS[c[1]]??+c[1]; s=s.slice(c[0].length); const dm=s.match(/^\s*demie?\b\s*/i); if(dm && count===1){ count=0.5; s=s.slice(dm[0].length); } }
      const rest=s.trim();
      for(const [re,fn] of UNITS){ const m=rest.match(re); if(m){ unitFn=fn; s=' '+rest.slice(m[0].length).replace(/^\s*(de|d')\s*/i,'')+' '; break; } }
    }
    const name=s.replace(/\s+/g,' ').trim().replace(/^(de|du|des|d')\s+/i,'');
    const exact=plats.find(p=>fslug(p.nom)===fslug(name));
    if(exact && grams==null && !unitFn){ const f=count||1; return {raw,ok:true,plat:exact,nom:exact.nom,quantite:(f!==1?'×'+f+' ':'')+(exact.portion||'portion'),kcal:exact.kcal*f,prot:exact.prot*f,gluc:exact.gluc*f,lip:exact.lip*f}; }
    const food=matchFood(name);
    if(grams==null && count!=null && !unitFn && !food){ const pl=matchPlat(name); if(pl) return {raw,ok:true,plat:pl,nom:pl.nom,quantite:(count!==1?'×'+count+' ':'')+(pl.portion||'portion'),kcal:pl.kcal*count,prot:pl.prot*count,gluc:pl.gluc*count,lip:pl.lip*count}; }
    if(!food){ const pl=matchPlat(name); if(pl && grams==null){ const f=count||1; return {raw,ok:true,plat:pl,nom:pl.nom,quantite:(f!==1?'×'+f+' ':'')+(pl.portion||'portion'),kcal:pl.kcal*f,prot:pl.prot*f,gluc:pl.gluc*f,lip:pl.lip*f}; }
      return {raw,ok:false,nom:name||raw}; }
    let g=grams, estimated=false;
    if(g==null){ if(unitFn) g=(count||1)*unitFn(food); else if(count!=null) g=count*(food.u||food.p||100); else { g=food.p||100; estimated=true; } }
    const k=g/100;
    return {raw,ok:true,food,nom:food.n,quantite:Math.round(g)+(liquid?' ml':' g')+(estimated?' (portion type)':''),grams:g,estimated,kcal:food.k*k,prot:food.pr*k,gluc:food.g*k,lip:food.l*k};
  });
}

function authMsg(e){
  const m=String(e&&e.message||e||'').toLowerCase();
  if(m.includes('invalid login')) return 'Pseudo ou mot de passe incorrect.';
  if(m.includes('already registered')||m.includes('already been registered')||m.includes('database error saving new user')||m.includes('already exists')) return 'Ce pseudo est déjà pris, choisis-en un autre.';
  if(m.includes('email not confirmed')) return 'Compte bloqué : l’admin doit désactiver « Confirm email » dans Supabase (Authentication > Sign In / Providers > Email).';
  if(m.includes('signups not allowed')||m.includes('signup is disabled')) return 'Les inscriptions sont fermées pour le moment.';
  if(m.includes('password')) return 'Mot de passe trop court : 6 caractères minimum.';
  if(m.includes('rate limit')||m.includes('too many')) return 'Trop d’essais d’affilée, attends une minute.';
  if(m.includes('fetch')||m.includes('network')) return 'Pas de connexion internet, réessaie.';
  return 'Erreur : '+(e&&e.message||'inconnue');
}
function dbErr(e, what){
  console.warn(what, e);
  const m=String(e&&e.message||'').toLowerCase();
  if(e && (e.code==='42501' || m.includes('row-level security'))) return toast(what==='planning'?'La semaine est verrouillée : l’admin a déjà exporté.':'Action non autorisée.');
  if(e && e.code==='23505') return toast('Ça existe déjà.');
  if(e && e.code==='42P01') return toast('Base pas à jour : l’admin doit relancer le script SQL (partie V2).');
  if(m.includes('fetch')||m.includes('network')) return toast('Pas de connexion internet, réessaie.');
  toast('Erreur'+(what?' ('+what+')':'')+' : '+(e&&e.message||'inconnue'));
}

function progFor(uid){

/* ================= PROGRAMME DU JOUR ================= */
function planOf(uid, mon){ return plannings.find(p=>p.user_id===uid && p.debut===ymd(mon)) || null; }
function salleDays(uid, mon){ const pl=planOf(uid,mon); if(!pl) return null; return Object.keys(pl.data.jours||{}).map(Number).filter(d=>pl.data.jours[d]&&pl.data.jours[d].salle).sort((a,b)=>a-b); }
function plannedDays(uid, mon, kind){ const pl=planOf(uid,mon); if(!pl||!pl.data||!pl.data.jours) return null; return Object.keys(pl.data.jours).map(Number).filter(d=>pl.data.jours[d]&&pl.data.jours[d][kind]).sort((a,b)=>a-b); }
function planHour(uid, wd, kind){ const pl=planOf(uid,curMon()); const j=pl&&pl.data&&pl.data.jours&&pl.data.jours[wd]; return j&&j[kind]&&j[kind+'_h']?j[kind+'_h']:null; }
function caliFor(wd, uid=ME.id){
  const prog=uid===ME.id?program:progFor(uid).prog; const J=(prog.jours||[]).slice().sort((a,b)=>a.jour-b.jour); if(!J.length) return null;
  const days=plannedDays(uid,curMon(),'cali'); if(!days) return J.find(j=>+j.jour===wd)||null;
  if(!days.includes(wd)) return null;
  if(days.every(d=>J.some(j=>+j.jour===d))) return J.find(j=>+j.jour===wd)||null;
  return J[days.indexOf(wd)%J.length]; }
function salleFor(wd, uid=ME.id){
  if(!modsOf(memberById(uid)||ME).salle) return null;
  const prog=progFor(uid).prog; const S=(prog.salle&&Array.isArray(prog.salle.seances)&&prog.salle.seances.length)?prog.salle.seances:DEFAULT_SALLE.seances;
  const withDay=S.filter(s=>s.jour); if(withDay.length) return withDay.find(s=>+s.jour===wd)||null;
  const days=salleDays(uid,curMon()) || [1,3,5]; const i=days.indexOf(wd); return i>=0?S[i%S.length]:null;
}
function doneOn(date, type){ const k=ymd(date); return perfs.some(p=>typeOf(p)===type && ymd(p.date)===k); }
const gymName = e => e.nom || (gymOf(e.exo)||{}).nom || e.exo;
const repsLow = r => parseInt(String(r||'').match(/\d+/)?.[0]||'0',10)||10;

const SRC_LABEL = {perso:'Programme perso', groupe:'Programme de l’équipe', defaut:'Programme de départ'};
const ACTIVITES = {sedentaire:['Sédentaire (études, peu de marche)',1.2],leger:['Léger (marche, 1-2 séances/sem)',1.375],modere:['Modéré (3-4 séances/sem)',1.55],actif:['Actif (5+ séances/sem ou job physique)',1.725]};
const OBJECTIFS = {'perte de gras':0.85,'maintien':1,'prise de muscle':1.1};
function estimate(i){
  if(!i||!i.poids||!i.taille||!i.age||!i.sexe) return null;
  const bmr=10*i.poids+6.25*i.taille-5*i.age+(i.sexe==='F'?-161:5);
  const kcal=Math.round(bmr*(ACTIVITES[i.activite]||ACTIVITES.modere)[1]*(OBJECTIFS[i.objectif]||1)/10)*10;
  const prot=Math.round(i.poids*(i.objectif==='perte de gras'?2:1.8)), lip=Math.round(i.poids*0.9);
  const gluc=Math.max(0,Math.round((kcal-prot*4-lip*9)/4));
  return {kcal,prot,gluc,lip};
}
function nutriTarget(uid, infos){
  const pr=progFor(uid).prog;
  if(pr.alimentation && +pr.alimentation.kcal) return Object.assign({},pr.alimentation,{src:'programme'});
  const e=estimate(infos!==undefined?infos:(uid===ME.id?myInfos:null)); return e?Object.assign(e,{src:'estimation'}):null;
}

function openGymEx(e){

    ${g.muscles?`<p class="small">💪 ${esc(g.muscles)}</p>`:''}${g.info?`<p class="mut">➕ ${esc(g.info)}</p>`:''}${e.note?`<p class="mut">📝 ${esc(e.note)}</p>`:''}<p class="mut">${esc(e.consigne||g.conseil||'')}</p>

/* ================= SÉANCE SALLE (séries × reps × charge, repos auto) ================= */
let gym=null, gymTick=null;
function lastCharges(){ const m={}; perfs.filter(p=>typeOf(p)==='salle').forEach(p=>(p.blocs||[]).forEach(b=>{ const s=(b.series||[]).filter(x=>x.charge!=null&&x.charge!==''); if(s.length) m[b.exo]=+s[s.length-1].charge; })); return m; }
function startGym(sess, wd){

function renderGym(){

    <div class="gdots">${S.exos.map((x,k)=>`<button class="${k===gym.i?'on ':''}${gym.sets[k].every(s=>s.fait)?'done':''}" data-k="${k}" aria-label="Exo ${k+1}"></button>`).join('')}</div>
    <div class="gcard"><div class="gfig"></div><h2 id="gName"></h2>

      <details><summary class="small">Technique</summary><p class="mut">${esc(e.consigne||g.conseil||'')}</p></details>
      <table class="gsets"><tr><th>Série</th><th>Charge (kg)</th><th>Reps</th><th></th></tr>

function setDone(k){
  const sets=gym.sets[gym.i], s=sets[k], e=gym.sess.exos[gym.i];
  const ci=$('#gc'+k), ri=$('#gr'+k); if(ci) s.charge=ci.value===''?'':+ci.value; if(ri) s.reps=ri.value===''?'':+ri.value;
  if(s.fait){ s.fait=false; renderGym(); return; }
  s.fait=true;
  // pré-remplir la série suivante avec la même charge
  if(sets[k+1] && sets[k+1].charge==='' ) sets[k+1].charge=s.charge;
  const exoDone=sets.every(x=>x.fait), lastExo=gym.i===gym.sess.exos.length-1;
  if(exoDone && lastExo){ gym.rest=null; beepEnd(); say('Dernière série faite. Bravo !'); toast('Dernière série faite 💪 Touche « Terminer la séance »'); renderGym(); return; }
  const nextName = exoDone ? gymName(gym.sess.exos[gym.i+1]) : null;
  gym.rest={end:Date.now()+(+e.repos||90)*1000,total:+e.repos||90,advance:exoDone,next:nextName,last:null};
  beepRest(); say(exoDone?('Repos. Ensuite : '+nextName):'Repos');
  renderGym();
}
function gymLoop(){
  if(!gym) return;
  const c=$('#gChrono'); if(c) c.textContent=fmt((Date.now()-gym.start)/1000);
  const bar=$('#gRestBar'); if(!bar) return;
  if(!gym.rest){ bar.hidden=true; return; }
  const rem=Math.ceil((gym.rest.end-Date.now())/1000);
  bar.hidden=false; $('#gRest').textContent=fmt(Math.max(0,rem));
  $('#gRestLbl').textContent=gym.rest.advance?('Repos · ensuite : '+gym.rest.next):('Repos · série '+(gym.sets[gym.i].findIndex(s=>!s.fait)+1));
  bar.style.setProperty('--p',Math.max(0,Math.min(1,1-(gym.rest.end-Date.now())/(gym.rest.total*1000))));
  if(rem<=3 && rem>=1 && gym.rest.last!==rem){ gym.rest.last=rem; beepTick(); }
  if(rem<=0){ const adv=gym.rest.advance; gym.rest=null; beepGo();
    if(adv && gym.i<gym.sess.exos.length-1){ gym.i++; say('C’est parti : '+gymName(gym.sess.exos[gym.i])); } else say('Série suivante');
    renderGym(); }
}
function e1rm(charge,reps){ charge=+charge; reps=+reps; if(!charge||!reps) return 0; return Math.round(charge*(1+Math.min(reps,12)/30)); }
function finishGym(early){

    return {exo:e.exo,nom:gymName(e),unite:'kg',cible:{series:+e.series||null,reps:e.reps,charge:e.charge??null,repos:+e.repos||null},series:done,
      score:Math.min(110,Math.round(sum(done.map(s=>s.reps))/target*100))}; });

    <div class="tbl"><table>${blocs.map(b=>`<tr><td>${esc(b.nom)}</td><td class="small">${b.series.length?b.series.map(x=>(x.charge!=null?x.charge+'×':'')+x.reps).join(' · '):'–'}</td><td><span class="chip" style="background:${scoreCol(b.score)}">${b.score}%</span></td></tr>`).join('')}</table></div>
    <h3 style="margin-top:14px">Ressenti global</h3><div class="feel"></div>

    b.onclick=()=>{ feel=v; fw.querySelectorAll('button').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); }; fw.append(b); });
  const [bSave,bSkip]=s.querySelectorAll('.btns button');

    const P=G.prog; const ses={id:Date.now(),type:'salle',date:G.startISO,prog_key:P.titre+'|S'+P.semaine,programme:P.titre,semaine:P.semaine,jour:G.wd,nom_jour:G.sess.nom||'Salle',
      complete:!early,duree_s:Math.round((Date.now()-G.start)/1000),ressenti:feel,note:s.querySelector('textarea').value.trim().slice(0,500),blocs,resume:{volume,top,maxreps}};
    if(!(await saveSession(ses))){ bSave.disabled=false; bSave.textContent='💾 Réessayer'; return; }
    o.remove(); gym=null; toast('Séance salle enregistrée ✓'); show('perfs'); };

const mealTime = g => { const m=String(g||'').match(/-(\d{10,})$/); return m?new Date(+m[1]):null; };

    ${macroBar('🔥 Calories',T.kcal,tg&&tg.kcal,' kcal','var(--work)')}${macroBar('🥩 Protéines',T.prot,tg&&tg.prot,' g','var(--rest)')}
    <div class="grid2">${macroBar('🍚 Glucides',T.gluc,tg&&tg.gluc,' g','var(--prep)')}${macroBar('🥑 Lipides',T.lip,tg&&tg.lip,' g','var(--abdos)')}</div>
    ${tg?`<p class="small">${tg.src==='programme'?'Objectifs fixés dans ton programme de la semaine.':'Estimation provisoire à partir de ton profil, ajustée chaque semaine par l’admin.'}${tg.conseils?' '+esc(tg.conseils):''}</p>`:''}`;

  const add=el('button','big','＋ Ajouter un repas'); add.onclick=()=>openMealSheet(); v.append(add);

  if(!meals.length) v.append(el('div','empty','Aucun repas noté ce jour. Touche « Ajouter un repas » à chaque fois que tu manges.'));

    m.items.forEach(r=>{ const it=el('div','ritem'); it.innerHTML=`<div><b></b><div class="small">${r.quantite?esc(r.quantite)+' · ':''}${Math.round(r.kcal)} kcal · ${r1(r.prot)} g prot</div></div><button class="iconbtn" aria-label="Retirer">✕</button>`;
      it.querySelector('b').textContent=r.nom;
      it.querySelector('button').onclick=async()=>{ const {error}=await sb.from('repas').delete().eq('id',r.id); if(error) return dbErr(error,'repas'); repasTeam=repasTeam.filter(x=>x.id!==r.id); renderRepas(); };
      box.append(it); });
    mc.querySelector('[data-a=add]').onclick=()=>openMealSheet(m);
    mc.querySelector('[data-a=del]').onclick=async()=>{ if(!(await askConfirm('Supprimer ce repas ?',`${m.items.length} aliment${m.items.length>1?'s':''} seront retirés.`,'Supprimer'))) return;
      for(const r of m.items){ const {error}=await sb.from('repas').delete().eq('id',r.id); if(error) return dbErr(error,'repas'); repasTeam=repasTeam.filter(x=>x.id!==r.id); }
      renderRepas(); };
    v.append(mc);
  });
  if(isToday){ const y=dayRepas(ME.id,ymd(addDays(new Date(),-1)));
    if(y.length && !list.length){ const b=el('button','btn','↺ Reprendre les repas d’hier'); b.style.marginTop='10px';
      b.onclick=async()=>{ b.disabled=true; const gmap={};
        for(const r of y){ const old=r.groupe||r.moment; if(!gmap[old]){ const t=mealTime(r.groupe)||new Date(r.created_at||Date.now()); const nt=parseYmd(repasDay); nt.setHours(t.getHours(),t.getMinutes(),0,0); gmap[old]=ME.id.slice(0,8)+'-'+Math.random().toString(36).slice(2,6)+'-'+nt.getTime(); }
          await insertItems([{nom:r.nom,quantite:r.quantite,kcal:r.kcal,prot:r.prot,gluc:r.gluc,lip:r.lip,plat_id:r.plat_id}],r.moment,gmap[old]); }
        renderRepas(); toast('Repas d’hier copiés ✓'); };
      v.append(b); } }
}
async function insertItems(items, label, groupe){
  const rows=items.map((d,i)=>({id:ME.id.slice(0,8)+'-'+Date.now()+'-'+i+'-'+Math.floor(Math.random()*1e4),user_id:ME.id,jour:repasDay||ymd(new Date()),moment:label,groupe,
    nom:String(d.nom).slice(0,80),quantite:d.quantite?String(d.quantite).slice(0,40):null,kcal:r1(d.kcal),prot:r1(d.prot),gluc:r1(d.gluc),lip:r1(d.lip),plat_id:d.plat_id||null}));
  if(!rows.length) return true;
  const {error}=await sb.from('repas').insert(rows); if(error){ dbErr(error,'repas'); return false; }
  const now=new Date().toISOString(); rows.forEach(r=>repasTeam.push(Object.assign({created_at:now},r))); return true;
}
async function addPlat(d){
  const row={nom:String(d.nom).slice(0,80),portion:d.portion?String(d.portion).slice(0,40):null,kcal:r1(d.kcal),prot:r1(d.prot),gluc:r1(d.gluc),lip:r1(d.lip),source:d.source||'manuel',created_by:ME.id};
  const {error}=await sb.from('plats').insert(row); if(error){ dbErr(error,'plat'); return null; }
  await loadPlats(); return plats.filter(p=>p.nom===row.nom && p.created_by===ME.id).pop()||null;
}
function platUsage(){ const m={}; repasTeam.forEach(r=>{ if(r.plat_id) m[r.plat_id]=(m[r.plat_id]||0)+1; }); return m; }

/* Feuille « Ajouter un repas » : saisie rapide + plats de l'équipe + produit + manuel */
function openMealSheet(existing){
  const o=el('div','ov'), s=el('div','sheet');
  const base=existing?existing.t:(repasDay===ymd(new Date())?new Date():Object.assign(parseYmd(repasDay),{}));
  if(!existing && repasDay!==ymd(new Date())) base.setHours(12,30,0,0);
  const st={label:existing?existing.label:guessLabel(base),time:String(base.getHours()).padStart(2,'0')+':'+String(base.getMinutes()).padStart(2,'0'),
    text:'',parsed:[],extras:[],panel:null,share:false,shareName:'',rows:[{n:'',q:'',u:'g'}]};
  const COUNTABLE=new Set(['Banane','Pomme','Orange','Kiwi','Poire','Mangue','Avocat','Œuf','Blanc d’œuf','Yaourt nature','Yaourt grec','Skyr','Croissant','Pain au chocolat','Bokit','Burger','Kebab','Sandwich','Galette de riz','Tortilla / wrap','Dattes','Biscuits / cookies','Soda','Bière','Accras','Saucisse / merguez','Pizza','Tomates','Carottes','Poivron','Patate douce cuite','Banane plantain cuite']);
  const UNITS_UI=[['g','g'],['ml','ml'],['piece','pièce(s)'],['tranche','tranche(s)'],['cas','c. à soupe'],['cac','c. à café'],['verre','verre(s)'],['bol','bol(s)'],['pot','pot(s)'],['portion','portion(s)']];
  const rowText=r=>{ const n=r.n.trim(), q=String(r.q||'').trim(); if(!n) return ''; if(!q) return n; if(r.u==='g') return q+'g '+n; if(r.u==='ml') return q+'ml '+n; if(r.u==='piece') return q+' '+n; return q+' '+r.u+' '+n; };
  const recompute=()=>{ st.parsed=[...st.rows.filter(r=>r.n.trim()).flatMap(r=>parseMealText(rowText(r)).map(x=>Object.assign(x,{raw:x.ok?x.raw:r.n.trim()}))),...parseMealText(st.text)]; drawPreview(); };
  const close=()=>{ o.remove(); renderRepas(); };
  o.onclick=e=>{ if(e.target===o) close(); };
  const items=()=>[...st.parsed.filter(p=>p.ok),...st.extras];
  function render(){
    s.innerHTML=`<div class="rowb"><h2>${existing?'＋ Ajouter à ce repas':'🍽️ Nouveau repas'}</h2><button class="btn" id="mClose">Fermer</button></div>
      ${existing?`<p class="small">${esc(existing.label)}</p>`:`<div class="chips" id="mLab">${MEAL_LABELS.map(l=>`<button data-l="${l}">${l}</button>`).join('')}</div>
      <label for="mTime" class="inline">Heure <input type="time" id="mTime"></label>`}
      <div class="qlab">Aliments</div><div id="mRows"></div>
      <button class="btn" id="mAddRow" style="margin-top:8px">＋ Ajouter un aliment</button>
      <p class="small">Tape le début du nom, des suggestions s’affichent. Quantité vide = portion type. Les féculents (riz, pâtes…) sont comptés <b>cuits</b>.</p>
      <details id="mPhrase"${st.text?' open':''}><summary class="small">✍️ Ou écrire en une phrase</summary><textarea id="mText" placeholder="ex : riz 200g, steak haché 200g, 1 banane" style="min-height:60px;margin-top:6px"></textarea></details>
      <datalist id="foodlist">${[...new Set([...plats.map(p=>p.nom),...FOODS.map(f=>f.n)])].map(n=>`<option value="${esc(n)}"></option>`).join('')}</datalist>
      <div id="mPrev"></div>
      <div class="small" style="margin-top:10px">Ou ajoute depuis :</div>
      <div class="btns" style="margin-top:6px"><button class="btn" data-p="plats">👥 Plats de l’équipe</button><button class="btn" data-p="off">🔎 Produit / code-barres</button><button class="btn" data-p="man">✍️ Manuel</button></div>
      <div id="mPanel"></div>
      <div class="mtot" id="mTot"></div>
      ${existing?'':`<label class="tog"><input type="checkbox" id="mShare"><span>👥 Enregistrer aussi ce repas comme plat de l’équipe</span></label><input type="text" id="mShareName" maxlength="80" placeholder="Nom du plat (ex : Riz steak maison)" hidden>`}
      <div class="btns"><button class="btn pri" id="mSave" style="flex:1">💾 Enregistrer</button></div>`;
    s.querySelector('#mClose').onclick=close;
    const lab=s.querySelector('#mLab'); if(lab) lab.querySelectorAll('button').forEach(b=>{ b.classList.toggle('on',b.dataset.l===st.label); b.onclick=()=>{ st.label=b.dataset.l; lab.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); }; });
    const ti=s.querySelector('#mTime'); if(ti){ ti.value=st.time; ti.onchange=()=>st.time=ti.value; }
    const ta=s.querySelector('#mText'); ta.value=st.text;
    let deb=null; ta.oninput=()=>{ st.text=ta.value; clearTimeout(deb); deb=setTimeout(recompute,250); };
    const RW=s.querySelector('#mRows');
    const drawRows=()=>{ RW.innerHTML=''; st.rows.forEach((r,i)=>{ const w=el('div','mrow');
      w.innerHTML=`<input type="text" list="foodlist" placeholder="Aliment (ex : riz)" aria-label="Aliment"><input type="number" inputmode="decimal" step="any" min="0" placeholder="Qté" aria-label="Quantité"><select aria-label="Unité">${UNITS_UI.map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}</select><button class="iconbtn" aria-label="Retirer">✕</button>`;
      const [ni,qi]=w.querySelectorAll('input'), us=w.querySelector('select'); ni.value=r.n; qi.value=r.q; us.value=r.u;
      ni.oninput=()=>{ r.n=ni.value; clearTimeout(deb); deb=setTimeout(recompute,250); };
      ni.onchange=()=>{ r.n=ni.value; const f=matchFood(r.n); if(f && COUNTABLE.has(f.n) && !r.q && r.u==='g'){ r.u='piece'; us.value='piece'; } recompute(); };
      qi.oninput=()=>{ r.q=qi.value; if(r.u==='piece' && +r.q>=20){ r.u='g'; us.value='g'; } clearTimeout(deb); deb=setTimeout(recompute,250); };
      us.onchange=()=>{ r.u=us.value; recompute(); };
      w.querySelector('button').onclick=()=>{ st.rows.splice(i,1); if(!st.rows.length) st.rows.push({n:'',q:'',u:'g'}); drawRows(); recompute(); };
      RW.append(w); }); };
    drawRows();
    s.querySelector('#mAddRow').onclick=()=>{ st.rows.push({n:'',q:'',u:'g'}); drawRows(); const ins=RW.querySelectorAll('.mrow input[type=text]'); ins[ins.length-1].focus(); };
    s.querySelectorAll('[data-p]').forEach(b=>{ b.classList.toggle('on',st.panel===b.dataset.p); b.onclick=()=>{ st.panel=st.panel===b.dataset.p?null:b.dataset.p; render(); }; });
    const sh=s.querySelector('#mShare'); if(sh){ sh.checked=st.share; const nm=s.querySelector('#mShareName'); nm.hidden=!st.share; nm.value=st.shareName;
      sh.onchange=()=>{ st.share=sh.checked; nm.hidden=!sh.checked; }; nm.oninput=()=>st.shareName=nm.value; }
    s.querySelector('#mSave').onclick=save;
    drawPreview(); drawPanel();
  }
  function drawPreview(){
    const P=s.querySelector('#mPrev'); P.innerHTML='';
    const rows=[...st.parsed.map((p,i)=>({p,src:'t',i})),...st.extras.map((p,i)=>({p:Object.assign({ok:true},p),src:'x',i}))];
    rows.forEach(({p,src,i})=>{ const it=el('div','ritem'+(p.ok?'':' bad'));
      if(p.ok){ it.innerHTML=`<div><b></b><div class="small">${esc(p.quantite||'')} · ${Math.round(p.kcal)} kcal · ${r1(p.prot)} g prot${p.estimated?' · ⚠️ quantité estimée':''}</div></div>${src==='x'?'<button class="iconbtn" aria-label="Retirer">✕</button>':''}`; it.querySelector('b').textContent=p.nom;
        const x=it.querySelector('button'); if(x) x.onclick=()=>{ st.extras.splice(i,1); drawPreview(); }; }
      else { it.innerHTML=`<div><b></b><div class="small">pas reconnu : cherche-le ou ajoute-le en manuel</div></div><button class="btn" style="padding:6px 10px">🔎</button>`; it.querySelector('b').textContent='❓ '+p.raw;
        it.querySelector('button').onclick=()=>{ st.panel='plats'; st.searchSeed=p.nom; render(); }; }
      P.append(it); });
    const T=totals(items()); const tt=s.querySelector('#mTot');
    if(tt) tt.innerHTML=items().length?`<b>Total :</b> ${T.kcal} kcal · ${T.prot} g prot · ${T.gluc} g gluc · ${T.lip} g lip`:'';
  }
  function pushExtra(d){ st.extras.push(d); st.panel=null; render(); toast('Ajouté au repas ✓'); }
  function drawPanel(){
    const B=s.querySelector('#mPanel'); B.innerHTML=''; if(!st.panel) return;
    const box=el('div','card'); box.style.marginTop='10px'; B.append(box);
    if(st.panel==='plats'){
      box.innerHTML=`<input type="text" id="fSearch" placeholder="Chercher un plat partagé ou un aliment de base"><div class="flist"></div>`;
      const use=platUsage(); const L=box.querySelector('.flist'); const inp=box.querySelector('#fSearch'); inp.value=st.searchSeed||''; st.searchSeed='';
      const draw=()=>{ const qq=fslug(inp.value); L.innerHTML='';
        const P=plats.filter(p=>!qq||fslug(p.nom).includes(qq)).sort((a,b)=>(use[b.id]||0)-(use[a.id]||0)||a.nom.localeCompare(b.nom)).slice(0,25);
        const F=qq?FOODS.filter(f=>f.al.some(a=>a.includes(qq)||qq.includes(a))||fslug(f.n).includes(qq)).slice(0,12):[];
        if(!P.length && !F.length) L.append(el('p','small',qq?'Rien trouvé. Essaie « Produit » ou « Manuel ».':'Tape un nom pour chercher.'));
        P.forEach(p=>{ const it=el('button','fitem'); it.innerHTML=`<b></b><span class="small">👥 ${p.portion?esc(p.portion)+' · ':''}${Math.round(p.kcal)} kcal · ${r1(p.prot)} g prot${use[p.id]?` · ${use[p.id]}×`:''}</span>`; it.querySelector('b').textContent=p.nom; it.onclick=()=>pickPortion(box,p); L.append(it); });
        F.forEach(f=>{ const it=el('button','fitem'); it.innerHTML=`<b></b><span class="small">📗 base · ${f.k} kcal · ${f.pr} g prot / 100 g</span>`; it.querySelector('b').textContent=f.n; it.onclick=()=>pickGrams(box,{nom:f.n,kcal:f.k,prot:f.pr,gluc:f.g,lip:f.l,def:f.p,base:true}); L.append(it); }); };
      inp.oninput=draw; draw(); inp.focus();
    }
    if(st.panel==='off'){
      box.innerHTML=`<p class="small" style="margin-top:0">Produits du commerce (Open Food Facts), valeurs pour 100 g.</p>
        <div class="btns" style="flex-wrap:nowrap;margin-top:0"><input type="text" id="oQ" placeholder="ex : skyr, barre protéinée" style="flex:1"><button class="btn pri" id="oGo">Chercher</button></div>
        <div class="btns" style="flex-wrap:nowrap"><input type="text" id="oCode" inputmode="numeric" placeholder="ou code-barres" style="flex:1"><button class="btn" id="oCodeGo">OK</button>${'BarcodeDetector' in window?'<button class="btn" id="oScan" aria-label="Scanner">📷</button>':''}</div>
        <div class="flist" id="oRes"></div>`;

      const norm=p=>{ const n=p.nutriments||{}; const kcal=n['energy-kcal_100g']??(n['energy_100g']?n['energy_100g']/4.184:null); if(kcal==null||!p.product_name) return null;
        return {nom:p.product_name,marque:(p.brands||'').split(',')[0],kcal:+kcal,prot:+(n.proteins_100g||0),gluc:+(n.carbohydrates_100g||0),lip:+(n.fat_100g||0)}; };
      box.querySelector('#oGo').onclick=async()=>{ const qv=box.querySelector('#oQ').value.trim(); if(!qv) return; R.innerHTML='<p class="small">Recherche…</p>';

          const j=await res.json(); showP((j.products||[]).map(norm).filter(Boolean).slice(0,15)); }
        catch(e){ R.innerHTML=''; R.append(el('p','small','Recherche impossible pour le moment. Utilise la saisie rapide ou « Manuel ».')); } };
      const byCode=async code=>{ R.innerHTML='<p class="small">Recherche…</p>';
        try{ const res=await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=product_name,brands,nutriments,code`); const j=await res.json(); const p=j.product&&norm(j.product); showP(p?[p]:[]); }
        catch(e){ R.innerHTML=''; R.append(el('p','small','Produit introuvable.')); } };
      box.querySelector('#oCodeGo').onclick=()=>{ const c=box.querySelector('#oCode').value.replace(/\D/g,''); if(c) byCode(c); };
      const sc=box.querySelector('#oScan'); if(sc) sc.onclick=()=>scanBarcode(byCode);
    }
    if(st.panel==='man'){
      box.innerHTML=`<label for="xNom">Nom</label><input type="text" id="xNom" maxlength="80" placeholder="ex : Gratin de pâtes maison">

        <div class="grid2"><label>Calories (kcal)<input type="number" id="xK" inputmode="decimal"></label><label>Protéines (g)<input type="number" id="xP" inputmode="decimal"></label>
        <label>Glucides (g)<input type="number" id="xG" inputmode="decimal"></label><label>Lipides (g)<input type="number" id="xL" inputmode="decimal"></label></div>
        <label class="tog"><input type="checkbox" id="xShare" checked><span>👥 Ajouter aux plats de l’équipe</span></label>
        <div class="btns"><button class="btn pri" id="xAdd" style="flex:1">Ajouter au repas</button></div>`;
      box.querySelector('#xAdd').onclick=async()=>{ const d={nom:box.querySelector('#xNom').value.trim(),quantite:box.querySelector('#xQte').value.trim(),kcal:+box.querySelector('#xK').value||0,prot:+box.querySelector('#xP').value||0,gluc:+box.querySelector('#xG').value||0,lip:+box.querySelector('#xL').value||0};

        if(box.querySelector('#xShare').checked){ const p=await addPlat({nom:d.nom,portion:d.quantite,kcal:d.kcal,prot:d.prot,gluc:d.gluc,lip:d.lip,source:'manuel'}); d.plat_id=p&&p.id; }
        pushExtra(d); };
    }
  }
  function pickPortion(box,p){

      <div class="seg" id="pf">${[0.5,1,1.5,2,3].map(x=>`<button data-x="${x}">×${x}</button>`).join('')}</div><p class="mut" id="pTot"></p>

  }
  function pickGrams(box,p){
    box.innerHTML=`<h3></h3><label for="gG">Quantité (g)</label><input type="number" id="gG" inputmode="decimal"><p class="mut" id="gTot"></p>
      ${p.off?'<label class="tog"><input type="checkbox" id="gShare" checked><span>👥 Ajouter aux plats de l’équipe</span></label>':''}
      <div class="btns"><button class="btn pri" id="gAddF" style="flex:1">Ajouter au repas</button><button class="btn" id="gBack">Retour</button></div>`;
    box.querySelector('h3').textContent=p.nom+(p.marque?' · '+p.marque:'');
    const gI=box.querySelector('#gG'); gI.value=p.def||100; const k=()=>(+gI.value||0)/100;
    const upd=()=>box.querySelector('#gTot').textContent=`${Math.round(p.kcal*k())} kcal · ${r1(p.prot*k())} g prot · ${r1(p.gluc*k())} g gluc · ${r1(p.lip*k())} g lip`;
    gI.oninput=upd; upd(); box.querySelector('#gBack').onclick=drawPanel;
    box.querySelector('#gAddF').onclick=async()=>{ const g=+gI.value||0; if(!g) return toast('Indique une quantité');

async function saveQuestionnaire(A){

  const d=Object.assign({},myInfos||{}); baseKeys.forEach(k=>d[k]=A[k]===''?null:A[k]); d.questionnaire=qq;

}

function salleRecords(list){
  const m={};
  list.filter(p=>typeOf(p)==='salle').forEach(p=>(p.blocs||[]).forEach(b=>(b.series||[]).forEach(s=>{
    const v=e1rm(s.charge,s.reps); const cur=m[b.exo]||(m[b.exo]={exo:b.exo,nom:b.nom,best:null,e1rm:0,maxreps:0});
    if(v>cur.e1rm){ cur.e1rm=v; cur.best=`${s.charge} kg × ${s.reps}`; } if(s.reps>cur.maxreps) cur.maxreps=s.reps; })));
  return Object.values(m).sort((a,b)=>b.e1rm-a.e1rm||b.maxreps-a.maxreps);
}
function weekVolumes(list, weeks=8){
  const out=[]; const m0=curMon();
  for(let k=weeks-1;k>=0;k--){ const a=addDays(m0,-7*k), b=addDays(a,7);
    out.push({mon:a,vol:Math.round(sum(list.filter(p=>typeOf(p)==='salle'&&new Date(p.date)>=a&&new Date(p.date)<b).map(p=>(p.resume&&p.resume.volume)||0)))}); }
  return out;
}

function chartXY(series,{t0,t1,ymax,suffix='',step=false,yticks}){
  const W=440,H=250,L=46,R=12,T=12,B=30,iw=W-L-R,ih=H-T-B, span=Math.max(DAY,t1-t0);
  const x=t=>L+(t-t0)/span*iw, y=v=>T+(1-v/ymax)*ih; let g='';
  (yticks||Array.from({length:6},(_,k)=>Math.round(ymax*k/5))).forEach(v=>{ g+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L-6}" y="${y(v)+4}" text-anchor="end">${v>=10000?Math.round(v/1000)+'k':v}${suffix}</text>`; });
  const nd=Math.round(span/DAY), st=nd<=10?3:nd<=35?7:nd<=100?28:60;
  for(let k=0;k*st<=nd;k++){ const t=t0+k*st*DAY, dd=new Date(t); g+=`<text class="ax" x="${x(t)}" y="${H-10}" text-anchor="${k===0?'start':'middle'}">${dd.getDate()}/${dd.getMonth()+1}</text>`; }
  series.forEach(s=>{ if(!s.pts.length) return; let path='';
    if(step) s.pts.forEach((p,k)=>{ const X=x(p.t).toFixed(1),Y=y(p.v).toFixed(1); path+=k?`H${X} V${Y}`:`M${X} ${Y}`; });
    else path=s.pts.map((p,k)=>(k?'L':'M')+x(p.t).toFixed(1)+' '+y(p.v).toFixed(1)).join(' ');
    g+=`<path d="${path}" fill="none" stroke="${s.color}" stroke-width="${s.me?3.2:2.2}" stroke-linejoin="round" stroke-linecap="round" opacity="${s.me?1:.85}"/>`;
    const pts=step?[s.pts[s.pts.length-1]]:s.pts; pts.forEach((p,k)=>{ const last=k===pts.length-1; g+=`<circle cx="${x(p.t)}" cy="${y(p.v)}" r="${last?5:3}" fill="${s.color}" stroke="var(--card)" stroke-width="${last?2:1}"/>`; }); });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Courbes de l’équipe">${g}</svg>`;
}

async function importPrograms(txt, target){
  let j; try{ j=parseProgramsText(txt); }catch(e){ toast('Texte illisible : vérifie que tu as tout copié.'); return false; }
  const items=(j.format==='cali-programmes' && Array.isArray(j.programmes)) ? j.programmes.map(x=>({pour:x.pour??null,prog:x.programme})) : [{pour:'__cible__',prog:j}];
  const problems=[], rows=[];
  for(const it of items){
    if(!validProgram(it.prog)){ problems.push('programme invalide'+(it.pour&&it.pour!=='__cible__'?' pour '+it.pour:'')); continue; }
    let uid=null;
    if(it.pour==='__cible__') uid=target||null;
    else if(it.pour && !['tous','equipe','équipe','groupe'].includes(String(it.pour).toLowerCase())){
      const m=members.find(x=>x.pseudo.toLowerCase()===String(it.pour).toLowerCase()); if(!m){ problems.push('pseudo inconnu : '+it.pour); continue; } uid=m.id; }
    rows.push({user_id:uid,semaine:+it.prog.semaine||null,titre:String(it.prog.titre||''),data:it.prog});
  }
  if(problems.length){ toast('Import annulé : '+problems.join(', ')); return false; }
  if(!rows.length){ toast('Rien à importer'); return false; }
  const {error}=await sb.from('programmes').insert(rows); if(error){ dbErr(error,'import programme'); return false; }
  await loadPrograms(); resolveProgram();
  toast(`✓ ${rows.length} programme${rows.length>1?'s':''} publié${rows.length>1?'s':''}`); return true;
}

function ac(){ if(!AC){ const C=window.AudioContext||window.webkitAudioContext; if(C) AC=new C(); } if(AC&&AC.state==='suspended') AC.resume(); return AC; }
function tone(f,d,w=0,type='sine',vol=.3){ if(!settings.sound) return; const a=ac(); if(!a) return;
  const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+w; o.type=type; o.frequency.value=f;
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.015); g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+d+.05); }
const vib = p => { try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} };
const beepGo   = () => { tone(880,.16); tone(1320,.4,.18); vib([120,60,220]); };
const beepRest = () => { tone(520,.3,0,'triangle',.35); tone(360,.55,.3,'triangle',.35); vib(400); };
const beepTick = () => { tone(740,.09,0,'square',.12); vib(40); };

  run={d,segs,total:t,t0:performance.now(),pausedTotal:0,paused:false,seg:-1,lastTick:null,over:false,
       scores:d.blocs.map(()=>null),reps:d.blocs.map(()=>''),reached:-1,startedAt:new Date().toISOString(),figExo:null,prog:program};

const elapsed = () => (performance.now()-run.t0-run.pausedTotal-(run.paused?performance.now()-run.pauseAt:0))/1000;
function tick(){
  if(!run || run.over || run.paused) return;
  const e=elapsed();
  if(e>=run.total){ finish(false); return; }
  let i=Math.max(run.seg,0); while(i<run.segs.length-1 && e>=run.segs[i].end) i++;
  if(i!==run.seg){ run.seg=i; enterSeg(run.segs[i]); }
  if(run.segs[i].type!=='prep') run.reached=Math.max(run.reached,run.segs[i].i);
  const sg=run.segs[i], rem=sg.end-e, sec=Math.ceil(rem);
  if(sec<=3 && sec>=1 && run.lastTick!==i+':'+sec){ run.lastTick=i+':'+sec; beepTick(); }
  $('#rTime').textContent = sg.type==='prep' ? sec : fmt(Math.max(0,Math.ceil(rem)));
  $('#rTotal').textContent = fmt(run.total - Math.max(e,PREP) + 0.999);
  const bars=$('#rBar').children; let acc=PREP;
  run.d.blocs.forEach((b,k)=>{ const len=+b.travail + +(b.repos||0); const p=Math.min(1,Math.max(0,(e-acc)/len)); bars[k].firstChild.style.width=(p*100)+'%'; acc+=len; });
}

    const ses={id:Date.now(),date:r.startedAt,prog_key:P.titre+'|S'+P.semaine,programme:P.titre,semaine:P.semaine,jour:+r.d.jour,nom_jour:r.d.nom,
      complete:!early,duree_s:Math.round(Math.max(0,dur-PREP)),ressenti:feel,note:s.querySelector('textarea').value.trim().slice(0,500),
      blocs:r.d.blocs.map((b,i)=>({exo:b.exo,nom:bname(b),travail:+b.travail,repos:+(b.repos||0),objectif:+b.objectif,unite:exOf(b).unite,
        score:r.scores[i],reps:r.reps[i]===''?null:+r.reps[i]}))};
    const ok=await saveSession(ses);
    if(!ok){ bSave.disabled=false; bSave.textContent='💾 Réessayer'; return; }
    o.remove(); run=null;
    toast('Séance enregistrée ✓'); show('perfs');
  };
  bSkip.onclick=async()=>{ if(await askConfirm('Ne pas enregistrer ?','Cette séance sera perdue.','Supprimer')){ o.remove(); run=null; show(curView); } };
  o.append(s); document.body.append(o);
}


/* ================= OUTILS ================= */
function summary(list){
  const m={};
  list.forEach(p=>(p.blocs||[]).forEach(b=>{ if(b.score==null) return;
    (m[b.exo]=m[b.exo]||{exo:b.exo,nom:(EX[b.exo]||{}).nom||b.nom,n:0,scores:[],objectifs:[]}); m[b.exo].n++; m[b.exo].scores.push(b.score); m[b.exo].objectifs.push(b.objectif); }));
  return Object.values(m).map(x=>({exo:x.exo,nom:x.nom,fois:x.n,moyenne_pct:Math.round(avg(x.scores)),dernier_objectif:x.objectifs[x.objectifs.length-1]}))
    .sort((a,b)=>a.moyenne_pct-b.moyenne_pct);
}
function exoTable(sm){
  const w=el('div','tbl'); w.innerHTML='<table><tr><th>Exercice</th><th>Fois</th><th>Moy.</th><th style="width:30%"></th></tr>'+sm.map(x=>
    `<tr><td>${esc(x.nom)}</td><td>${x.fois}</td><td><b style="color:${scoreCol(x.moyenne_pct)}">${x.moyenne_pct}%</b></td><td><div class="bar"><i style="width:${Math.min(100,x.moyenne_pct)}%;background:${scoreCol(x.moyenne_pct)}"></i></div></td></tr>`).join('')+'</table>';
  return w;
}
function sessDetails(p){
  const sc=sessScore(p); const d=el('details','sess');
  d.innerHTML=`<summary><span><b>${new Date(p.date).toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'})}</b> · S${esc(p.semaine)} J${esc(p.jour)} ${esc(p.nom_jour)}${p.complete?'':' <span class="small">(interrompue)</span>'}</span>
    <span class="chip" style="background:${scoreCol(sc)}">${sc==null?'–':sc+'%'}</span></summary>
    <div class="tbl"><table style="margin-top:8px">${(p.blocs||[]).map(b=>`<tr><td>${esc(b.nom)}</td><td class="small">${esc(b.objectif)}${b.unite==='s'?' s':' reps'}${b.reps!=null?' → '+esc(b.reps):''}</td><td><span class="chip" style="background:${scoreCol(b.score)}">${b.score==null?'–':b.score+'%'}</span></td></tr>`).join('')}</table></div>
    ${p.note?`<p class="mut">📝 ${esc(p.note)}</p>`:''}`;
  return d;
}
function copyText(text){
  const fallback=()=>{ const t=el('textarea'); t.value=text; document.body.append(t); t.select(); let ok=false; try{ ok=document.execCommand('copy'); }catch(_){} t.remove(); return ok; };
  try{ return navigator.clipboard.writeText(text).then(()=>true,()=>fallback()); }catch(e){ return Promise.resolve(fallback()); }
}
function readFile(f,cb){ if(!f) return; const r=new FileReader(); r.onload=()=>cb(r.result); r.readAsText(f); }
function hist(a){ return (Array.isArray(a.historique)?a.historique:[]).filter(h=>h&&h.date).slice().sort((x,y)=>new Date(x.date)-new Date(y.date)); }
function streak(h){
  const days=new Set(h.map(x=>dayKey(x.date))); let d=new Date(); if(!days.has(dayKey(d))) d=new Date(Date.now()-DAY);
  let n=0; while(days.has(dayKey(d))){ n++; d=new Date(d.getTime()-DAY); } return n;
}
function teamStats(a,start){
  const h=hist(a), inP=h.filter(x=>new Date(x.date)>=start), sc=inP.map(x=>x.score).filter(x=>x!=null);
  const fe=inP.map(x=>x.ressenti).filter(Boolean);
  const half=Math.floor(sc.length/2), trend = sc.length>=4 ? Math.round(avg(sc.slice(half))-avg(sc.slice(0,half))) : null;
  return {total:h.length,periode:inP.length,sem7:h.filter(x=>new Date(x.date)>Date.now()-7*DAY).length,moy:sc.length?Math.round(avg(sc)):null,
    trend,streak:streak(h),feel:fe.length?Math.round(avg(fe)):null,semaine:a.programme?.semaine||1};
}
function niceMax(v){ if(v<=5) return 5; const s=v<=20?5:v<=50?10:20; return Math.ceil(v/s)*s; }
function openEx(b){
  const ex=exOf(b); const o=el('div','ov'); const s=el('div','sheet');
  s.innerHTML=`<div class="rowb"><h2>${esc(bname(b))}</h2><button class="btn">Fermer</button></div><div class="fig-big"></div>
    <p class="r-target" style="font-size:18px;margin:10px 0 4px">${esc(targetTxt(b))}</p>
    <p class="mut">${esc(ex.conseil)}</p><p class="small">📏 ${esc(ex.compte)}</p>`;
  s.querySelector('.fig-big').append(makeFig(b.exo));
  s.querySelector('button').onclick=()=>o.remove(); o.onclick=e=>{ if(e.target===o) o.remove(); };
  o.append(s); document.body.append(o);
}
function saveFile(name,text){
  try{ const a=el('a'); a.href=URL.createObjectURL(new Blob([text],{type:'application/json'})); a.download=name; document.body.append(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},800); }
  catch(e){ toast('Téléchargement impossible : utilise « Copier »'); }
}

boot().catch(e=>{ console.error(e); renderSetupNeeded('Erreur au démarrage : '+(e&&e.message||e)); });
</script>
